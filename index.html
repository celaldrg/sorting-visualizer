<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sorting Visualizer</title>
  <meta name="description" content="Watch ten classic sorting algorithms work step by step on an animated bar chart, with live comparison, swap and write counters.">
  <meta name="theme-color" content="#0f172a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sorting Visualizer">
  <meta property="og:description" content="Watch ten classic sorting algorithms work step by step on an animated bar chart, with live comparison, swap and write counters.">
  <meta property="og:url" content="https://celaldrg.github.io/sorting-visualizer/">
  <meta property="og:image" content="https://celaldrg.github.io/sorting-visualizer/docs/screenshot.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="800">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236366f1'/%3E%3Crect x='6.1' y='17' width='3.6' height='8' rx='1.2' fill='%23e0e7ff'/%3E%3Crect x='11.5' y='13' width='3.6' height='12' rx='1.2' fill='%23e0e7ff'/%3E%3Crect x='16.9' y='9.5' width='3.6' height='15.5' rx='1.2' fill='%23fbbf24'/%3E%3Crect x='22.3' y='6.5' width='3.6' height='18.5' rx='1.2' fill='%2334d399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#818cf8"/>
            <stop offset="1" stop-color="#4f46e5"/>
          </linearGradient>
        </defs>
        <rect width="32" height="32" rx="9" fill="url(#brand-gradient)"/>
        <rect x="6.1" y="17" width="3.6" height="8" rx="1.2" fill="#e0e7ff"/>
        <rect x="11.5" y="13" width="3.6" height="12" rx="1.2" fill="#e0e7ff"/>
        <rect x="16.9" y="9.5" width="3.6" height="15.5" rx="1.2" fill="#fbbf24"/>
        <rect x="22.3" y="6.5" width="3.6" height="18.5" rx="1.2" fill="#34d399"/>
      </svg>
      <h1 class="brand-title" data-i18n="app.title">Sorting Visualizer</h1>
    </div>
    <div class="topbar-actions">
      <button id="sound" class="icon-btn" type="button" aria-pressed="false" aria-label="Comparison sounds" title="Comparison sounds" data-i18n-aria-label="sound.toggle" data-i18n-title="sound.toggle">
        <svg class="icon" data-icon="sound-on" viewBox="0 0 24 24" aria-hidden="true" hidden>
          <path fill="currentColor" d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.4a.8.8 0 0 0 1.4-.6V5.7a.8.8 0 0 0-1.4-.6l-4 3.4H5a1 1 0 0 0-1 1Z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4.2 4.2 0 0 1 0 6M18.6 6.4a8 8 0 0 1 0 11.2"/>
        </svg>
        <svg class="icon" data-icon="sound-off" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M4 9.5v5a1 1 0 0 0 1 1h2.6l4 3.4a.8.8 0 0 0 1.4-.6V5.7a.8.8 0 0 0-1.4-.6l-4 3.4H5a1 1 0 0 0-1 1Z"/>
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="m16.5 9.5 5 5m0-5-5 5"/>
        </svg>
      </button>
      <button id="lang" class="icon-btn lang-btn" type="button" title="Türkçeye geç" data-i18n="lang.next" data-i18n-title="lang.switch">TR</button>
    </div>
  </header>

  <main class="layout">
    <section class="card stage" aria-labelledby="algo-title">
      <div class="stage-head">
        <h2 id="algo-title" class="stage-title">Quick sort (Lomuto)</h2>
        <p id="status" class="status" data-state="ready" role="status">Ready</p>
      </div>

      <dl class="stats">
        <div class="stat" data-role="compare">
          <dt data-i18n="stats.comparisons">Comparisons</dt>
          <dd id="stat-comparisons">0</dd>
        </div>
        <div class="stat" data-role="swap">
          <dt data-i18n="stats.swaps">Swaps</dt>
          <dd id="stat-swaps">0</dd>
        </div>
        <div class="stat" data-role="write">
          <dt data-i18n="stats.writes">Writes</dt>
          <dd id="stat-writes">0</dd>
        </div>
        <div class="stat" data-role="steps">
          <dt data-i18n="stats.steps">Steps</dt>
          <dd><span id="stat-steps">0</span><span class="stat-total"> / <span id="stat-total">0</span></span></dd>
        </div>
      </dl>

      <div class="chart-wrap">
        <canvas id="chart" class="chart" role="img" aria-label="Bar chart of the values being sorted"></canvas>
      </div>
      <div id="progress" class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress" data-i18n-aria-label="progress.label">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <div class="chart-foot">
        <ul class="legend" aria-label="Color key" data-i18n-aria-label="legend.label">
          <li><span class="swatch" data-role="compare"></span><span data-i18n="legend.compare">Compare</span></li>
          <li><span class="swatch" data-role="swap"></span><span data-i18n="legend.swap">Swap</span></li>
          <li><span class="swatch" data-role="write"></span><span data-i18n="legend.write">Write</span></li>
          <li><span class="swatch" data-role="sorted"></span><span data-i18n="legend.sorted">Sorted</span></li>
        </ul>
        <p id="step-text" class="step-text"></p>
      </div>

      <div class="stage-foot">
        <div class="transport" role="group" aria-label="Playback" data-i18n-aria-label="controls.label">
          <button id="shuffle" class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 7h3.2c1.6 0 2.8.7 3.7 2l4.2 6c.9 1.3 2.1 2 3.7 2H21"/>
              <path d="M3 17h3.2c1.6 0 2.8-.7 3.7-2l.6-.85M13.5 9.85l.6-.85c.9-1.3 2.1-2 3.7-2H21"/>
              <path d="m18 4 3 3-3 3M18 14l3 3-3 3"/>
            </svg>
            <span data-i18n="controls.shuffle">Shuffle</span>
          </button>
          <button id="reset" class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M19 5.6v12.8a1 1 0 0 1-1.55.83l-9.3-6.4a1 1 0 0 1 0-1.66l9.3-6.4A1 1 0 0 1 19 5.6Z"/>
              <rect x="4.4" y="5" width="2.6" height="14" rx="1.1"/>
            </svg>
            <span data-i18n="controls.reset">Reset</span>
          </button>
          <button id="play" class="btn btn-primary" type="button">
            <svg class="icon" data-icon="play" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M8 5.14v13.72a1 1 0 0 0 1.53.85l10.6-6.86a1 1 0 0 0 0-1.7L9.53 4.29A1 1 0 0 0 8 5.14Z"/>
            </svg>
            <svg class="icon" data-icon="pause" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor" hidden>
              <rect x="6" y="4.5" width="4.5" height="15" rx="1.2"/>
              <rect x="13.5" y="4.5" width="4.5" height="15" rx="1.2"/>
            </svg>
            <svg class="icon" data-icon="replay" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" hidden>
              <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/>
              <path d="M3.5 4.5v5h5"/>
            </svg>
            <span id="play-label">Play</span>
          </button>
          <button id="step" class="btn" type="button">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path d="M5 5.6v12.8a1 1 0 0 0 1.55.83l9.3-6.4a1 1 0 0 0 0-1.66l-9.3-6.4A1 1 0 0 0 5 5.6Z"/>
              <rect x="17" y="5" width="2.6" height="14" rx="1.1"/>
            </svg>
            <span data-i18n="controls.step">Step</span>
          </button>
        </div>
        <p class="hint hint-keys">
          <kbd data-i18n="hint.space">Space</kbd> <span data-i18n="hint.playPause">play / pause</span>
          <span class="hint-sep" aria-hidden="true">·</span>
          <kbd>→</kbd> <span data-i18n="hint.step">step</span>
          <span class="hint-sep" aria-hidden="true">·</span>
          <kbd>R</kbd> <span data-i18n="hint.shuffle">shuffle</span>
        </p>
        <p class="hint hint-touch" data-i18n="hint.touch">Tap the chart to play or pause</p>
      </div>
    </section>

    <aside class="side">
      <section class="card panel" aria-labelledby="settings-title">
        <h2 id="settings-title" class="panel-title" data-i18n="settings.title">Settings</h2>
        <div class="field">
          <label class="field-label" for="algorithm" data-i18n="settings.algorithm">Algorithm</label>
          <select id="algorithm" class="select"></select>
        </div>
        <div class="field">
          <label class="field-label" for="pattern" data-i18n="settings.pattern">Input pattern</label>
          <select id="pattern" class="select"></select>
        </div>
        <div class="field">
          <div class="field-head">
            <label class="field-label" for="size" data-i18n="settings.size">Array size</label>
            <output id="size-value" class="field-value" for="size">50</output>
          </div>
          <input id="size" class="range" type="range" min="5" max="300" step="1" value="50">
        </div>
        <div class="field">
          <div class="field-head">
            <label class="field-label" for="speed" data-i18n="settings.speed">Speed</label>
            <output id="speed-value" class="field-value" for="speed"></output>
          </div>
          <input id="speed" class="range" type="range" min="1" max="100" step="1" value="50">
        </div>
      </section>

      <section class="card panel" aria-labelledby="info-title">
        <h2 id="info-title" class="panel-title" data-i18n="info.title">How it works</h2>
        <p id="info-text" class="info-text"></p>
        <dl class="complexity">
          <div><dt data-i18n="info.best">Best</dt><dd id="cx-best"></dd></div>
          <div><dt data-i18n="info.average">Average</dt><dd id="cx-average"></dd></div>
          <div><dt data-i18n="info.worst">Worst</dt><dd id="cx-worst"></dd></div>
          <div><dt data-i18n="info.space">Extra space</dt><dd id="cx-space"></dd></div>
        </dl>
        <p id="info-stable" class="stable" data-stable="false"></p>
        <p id="info-symbols" class="symbols"></p>
      </section>
    </aside>
  </main>

  <footer class="footer">
    <a class="footer-link" href="https://github.com/celaldrg/sorting-visualizer">MIT · <span data-i18n="footer.source">Source on GitHub</span></a>
  </footer>
</body>
</html>
